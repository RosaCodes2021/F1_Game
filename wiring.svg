<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 800" width="1120" height="800" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="1120" height="800" fill="#ffffff"/>
  <text x="560" y="55" text-anchor="middle" font-size="30" font-weight="bold" fill="#111">F1 Reaction Game — Wiring</text>
  <text x="560" y="88" text-anchor="middle" font-size="17" fill="#555">ESP32-S3 · MAX7219 8×8 LED matrix · 2.8" ILI9341 TFT · button · passive buzzer</text>

  <!-- ===== wires: LED matrix ===== -->
  <g stroke-width="4" fill="none" stroke-linecap="round">
    <line x1="270" y1="200" x2="420" y2="200" stroke="#d62828"/>
    <line x1="270" y1="240" x2="420" y2="240" stroke="#222"/>
    <line x1="270" y1="300" x2="420" y2="300" stroke="#1d70b8"/>
    <line x1="270" y1="340" x2="420" y2="340" stroke="#1d70b8"/>
    <line x1="270" y1="380" x2="420" y2="380" stroke="#1d70b8"/>
    <!-- button -->
    <line x1="270" y1="470" x2="420" y2="470" stroke="#2a9d8f"/>
    <!-- buzzer -->
    <line x1="300" y1="560" x2="420" y2="560" stroke="#c2185b"/>
    <!-- TFT -->
    <line x1="700" y1="200" x2="850" y2="200" stroke="#6a4c93"/>
    <line x1="700" y1="240" x2="850" y2="240" stroke="#6a4c93"/>
    <line x1="700" y1="280" x2="850" y2="280" stroke="#6a4c93"/>
    <line x1="700" y1="320" x2="850" y2="320" stroke="#6a4c93"/>
    <line x1="700" y1="360" x2="850" y2="360" stroke="#6a4c93"/>
    <line x1="700" y1="400" x2="850" y2="400" stroke="#f77f00"/>
    <line x1="700" y1="460" x2="850" y2="460" stroke="#d62828"/>
    <line x1="700" y1="500" x2="850" y2="500" stroke="#222"/>
  </g>

  <!-- ===== ESP32-S3 ===== -->
  <rect x="420" y="150" width="280" height="460" rx="16" fill="#1b4332"/>
  <rect x="510" y="175" width="100" height="70" rx="6" fill="#adb5bd"/>
  <text x="560" y="216" text-anchor="middle" font-size="15" font-weight="bold" fill="#1b4332">ESP32-S3</text>
  <text x="560" y="590" text-anchor="middle" font-size="14" fill="#d8f3dc">Freenove ESP32-S3 CAM</text>
  <g font-size="16" font-weight="bold" fill="#ffffff">
    <text x="434" y="206">5V</text>
    <text x="434" y="246">GND</text>
    <text x="434" y="306">GPIO 13</text>
    <text x="434" y="346">GPIO 14</text>
    <text x="434" y="386">GPIO 15</text>
    <text x="434" y="476">GPIO 42</text>
    <text x="434" y="566">GPIO 41</text>
    <g text-anchor="end">
      <text x="686" y="206">GPIO 1</text>
      <text x="686" y="246">GPIO 2</text>
      <text x="686" y="286">GPIO 8</text>
      <text x="686" y="326">GPIO 9</text>
      <text x="686" y="366">GPIO 21</text>
      <text x="686" y="406">3V3</text>
      <text x="686" y="466">5V</text>
      <text x="686" y="506">GND</text>
    </g>
  </g>

  <!-- ===== LED matrix ===== -->
  <rect x="60" y="150" width="210" height="260" rx="10" fill="#e9ecef" stroke="#555" stroke-width="2"/>
  <text x="165" y="135" text-anchor="middle" font-size="18" font-weight="bold" fill="#111">LED matrix (MAX7219)</text>
  <rect x="80" y="170" width="100" height="100" rx="4" fill="#111"/>
  <g fill="#e63946">
    <circle cx="92" cy="182" r="4"/><circle cx="104" cy="182" r="4"/><circle cx="116" cy="182" r="4"/><circle cx="128" cy="182" r="4"/><circle cx="140" cy="182" r="4"/><circle cx="152" cy="182" r="4"/><circle cx="164" cy="182" r="4"/>
    <circle cx="92" cy="194" r="4"/><circle cx="104" cy="194" r="4"/><circle cx="116" cy="194" r="4"/><circle cx="128" cy="194" r="4"/><circle cx="140" cy="194" r="4"/><circle cx="152" cy="194" r="4"/><circle cx="164" cy="194" r="4"/>
  </g>
  <g fill="#4a1013">
    <circle cx="92" cy="206" r="4"/><circle cx="104" cy="206" r="4"/><circle cx="116" cy="206" r="4"/><circle cx="128" cy="206" r="4"/><circle cx="140" cy="206" r="4"/><circle cx="152" cy="206" r="4"/><circle cx="164" cy="206" r="4"/>
    <circle cx="92" cy="218" r="4"/><circle cx="104" cy="218" r="4"/><circle cx="116" cy="218" r="4"/><circle cx="128" cy="218" r="4"/><circle cx="140" cy="218" r="4"/><circle cx="152" cy="218" r="4"/><circle cx="164" cy="218" r="4"/>
    <circle cx="92" cy="230" r="4"/><circle cx="104" cy="230" r="4"/><circle cx="116" cy="230" r="4"/><circle cx="128" cy="230" r="4"/><circle cx="140" cy="230" r="4"/><circle cx="152" cy="230" r="4"/><circle cx="164" cy="230" r="4"/>
    <circle cx="92" cy="242" r="4"/><circle cx="104" cy="242" r="4"/><circle cx="116" cy="242" r="4"/><circle cx="128" cy="242" r="4"/><circle cx="140" cy="242" r="4"/><circle cx="152" cy="242" r="4"/><circle cx="164" cy="242" r="4"/>
    <circle cx="92" cy="254" r="4"/><circle cx="104" cy="254" r="4"/><circle cx="116" cy="254" r="4"/><circle cx="128" cy="254" r="4"/><circle cx="140" cy="254" r="4"/><circle cx="152" cy="254" r="4"/><circle cx="164" cy="254" r="4"/>
  </g>
  <g font-size="15" font-weight="bold" fill="#111" text-anchor="end">
    <text x="258" y="205">VCC</text>
    <text x="258" y="245">GND</text>
    <text x="258" y="305">DIN</text>
    <text x="258" y="345">CLK</text>
    <text x="258" y="385">CS</text>
  </g>

  <!-- ===== Button ===== -->
  <text x="165" y="440" text-anchor="middle" font-size="18" font-weight="bold" fill="#111">Button</text>
  <rect x="200" y="450" width="70" height="70" rx="6" fill="#e9ecef" stroke="#555" stroke-width="2"/>
  <circle cx="235" cy="485" r="20" fill="#2a9d8f"/>
  <line x1="200" y1="510" x2="140" y2="510" stroke="#222" stroke-width="4"/>
  <line x1="140" y1="510" x2="140" y2="530" stroke="#222" stroke-width="4"/>
  <g stroke="#222" stroke-width="3"><line x1="124" y1="532" x2="156" y2="532"/><line x1="130" y1="539" x2="150" y2="539"/><line x1="136" y1="546" x2="144" y2="546"/></g>
  <text x="100" y="530" text-anchor="end" font-size="15" fill="#111">GND</text>
  <text x="165" y="575" text-anchor="middle" font-size="13" fill="#555">use diagonal legs</text>

  <!-- ===== Buzzer ===== -->
  <text x="165" y="615" text-anchor="middle" font-size="18" font-weight="bold" fill="#111">Passive buzzer</text>
  <circle cx="235" cy="660" r="32" fill="#222"/>
  <circle cx="235" cy="660" r="8" fill="#555"/>
  <polyline points="267,660 300,660 300,560" fill="none" stroke="#c2185b" stroke-width="4"/>
  <text x="282" y="650" font-size="16" font-weight="bold" fill="#c2185b">+</text>
  <line x1="203" y1="660" x2="140" y2="660" stroke="#222" stroke-width="4"/>
  <line x1="140" y1="660" x2="140" y2="680" stroke="#222" stroke-width="4"/>
  <g stroke="#222" stroke-width="3"><line x1="124" y1="682" x2="156" y2="682"/><line x1="130" y1="689" x2="150" y2="689"/><line x1="136" y1="696" x2="144" y2="696"/></g>
  <text x="100" y="680" text-anchor="end" font-size="15" fill="#111">GND</text>

  <!-- ===== TFT ===== -->
  <text x="960" y="135" text-anchor="middle" font-size="18" font-weight="bold" fill="#111">2.8" TFT (ILI9341, SPI)</text>
  <rect x="850" y="150" width="220" height="400" rx="10" fill="#e9ecef" stroke="#555" stroke-width="2"/>
  <rect x="955" y="170" width="100" height="360" rx="4" fill="#111"/>
  <g fill="#e63946"><circle cx="1005" cy="215" r="14"/><circle cx="1005" cy="260" r="14"/></g>
  <g fill="#4a1013"><circle cx="1005" cy="305" r="14"/><circle cx="1005" cy="350" r="14"/><circle cx="1005" cy="395" r="14"/></g>
  <text x="1005" y="470" text-anchor="middle" font-size="22" font-weight="bold" fill="#fff">246</text>
  <text x="1005" y="492" text-anchor="middle" font-size="13" fill="#aaa">ms</text>
  <g font-size="15" font-weight="bold" fill="#111">
    <text x="862" y="205">CS</text>
    <text x="862" y="245">RESET</text>
    <text x="862" y="285">DC</text>
    <text x="862" y="325">SDI</text>
    <text x="862" y="365">SCK</text>
    <text x="862" y="405">LED</text>
    <text x="862" y="465">VCC</text>
    <text x="862" y="505">GND</text>
  </g>
  <text x="960" y="575" text-anchor="middle" font-size="13" fill="#555">SDO + touch pins (T_*) not connected</text>

  <!-- ===== legend ===== -->
  <g font-size="15" fill="#111">
    <line x1="430" y1="660" x2="470" y2="660" stroke="#d62828" stroke-width="4"/><text x="480" y="665">5V</text>
    <line x1="530" y1="660" x2="570" y2="660" stroke="#222" stroke-width="4"/><text x="580" y="665">GND</text>
    <line x1="640" y1="660" x2="680" y2="660" stroke="#f77f00" stroke-width="4"/><text x="690" y="665">3.3V</text>
    <line x1="430" y1="695" x2="470" y2="695" stroke="#1d70b8" stroke-width="4"/><text x="480" y="700">Matrix</text>
    <line x1="560" y1="695" x2="600" y2="695" stroke="#6a4c93" stroke-width="4"/><text x="610" y="700">TFT</text>
    <line x1="660" y1="695" x2="700" y2="695" stroke="#2a9d8f" stroke-width="4"/><text x="710" y="700">Button</text>
    <line x1="780" y1="695" x2="820" y2="695" stroke="#c2185b" stroke-width="4"/><text x="830" y="700">Buzzer</text>
  </g>
  <text x="560" y="760" text-anchor="middle" font-size="16" fill="#555">@rosacodes</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
